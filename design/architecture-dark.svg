<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" font-family="'Courier New', Courier, monospace" role="img" aria-label="AudBre architecture: browser and FastAPI run locally, a Modal A10G container runs sam-audio-large in the cloud">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8E8E8"/></marker></defs>
<text x="30" y="34" font-size="11" font-weight="700" letter-spacing="2.6" fill="#9A9A9A">LOCAL</text>
<text x="1090" y="34" font-size="11" font-weight="700" letter-spacing="2.6" fill="#9A9A9A" text-anchor="end">CLOUD</text>
