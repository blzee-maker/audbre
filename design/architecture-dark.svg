<text x="854" y="125" font-size="12" fill="#E8E8E8">sam-audio-large</text>
<text x="854" y="147" font-size="12" fill="#9A9A9A">flow-matching</text>
<text x="854" y="169" font-size="12" fill="#9A9A9A">transformer</text>
