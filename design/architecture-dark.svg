<line x1="682" y1="125" x2="838" y2="125" stroke="#E8E8E8" stroke-width="1.2" marker-end="url(#a)"/>
<text x="760" y="112" font-size="10" letter-spacing="0.6" fill="#9A9A9A" text-anchor="middle">30s WAV chunk + anchors</text>
<line x1="838" y1="225" x2="682" y2="225" stroke="#E8E8E8" stroke-width="1.2" marker-end="url(#a)"/>
