<text x="44" y="169" font-size="12" fill="#9A9A9A">drag to mark a span</text>
<text x="44" y="191" font-size="12" fill="#9A9A9A">A/B audition</text>
<text x="44" y="213" font-size="12" fill="#9A9A9A">removal stack</text>
<rect x="400" y="70" width="280" height="210" fill="none" stroke="#E8E8E8" stroke-width="1"/>
